

name: Phoenix Test Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron : 30 02 * * * # 8 am IST Every day
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        type: choice
        options: [qa,dev,uat]
        default: qa
        required: true

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' 
        distribution: 'temurin'
        cache: maven

        
    - name: Creating the .env file
     run: |
           echo "DB_URL={{ secerts.DB_URL }}" >> .env
           echo "DB_USER_NAME={{ secerts.DB_USER_NAME }}" >> .env
           echo "DB_PASSWORD={{ secerts.DB_PASSWORD }}" >> .env

    - name: Default value for execution
      id: default
      run: |
            echo "env=${{ github.event.inputs.env || 'qa'}}" >> $GITHUB_OUTPUT 
      
    - name: Execute Test Automation Framework
      run: mvn clean test -DsuiteXMLFile=testng.xml -Denv="${{steps.default.outputs.env}}"

    - name: Upload a Build Artifact
      if: always()
      uses: actions/upload-artifact@v4.6.2
      with:
        name: SureFire Report
        path: target/surefire-reports/
        retention-days: 10
        

   
